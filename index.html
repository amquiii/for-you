
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Will You Be My Valentine? 💗</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

    
        <!-- FIRST SCREEN: Valentine Question -->
        <section id="question" class="screen">

            <img
              src="images/mocha-bear-hearts.gif"
              alt="Bear animation"
              class="bear-gif"
>
            >

            <p class="question-text">
                Will you be my Valentine?
            </p>

            <div class="buttons">

                <button id="yesBtn">
                    Yes
                </button>

                <button id="noBtn">
                    Surely not?
                </button>

            </div>

        </section>

        <!-- SECOND SCREEN: Happy Ending -->
        <section id="result" class="screen" hidden>

            <img
             src="images/heart-milk-and-mocha-bear.gif"
             alt="Happy bear animation"
            class="bear-gif"
>

            <h2 class="result-text">
                Ok yay!!!
            </h2>

        </section>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
